name: CI Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1.13
      with:
        cmake-version: '3.21.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lame ffmpeg mp3val

    - name: Check ffmpeg has libmp3lame
      run: |
        # scripts/test_matrix.sh encodes part of its corpus through ffmpeg's
        # libmp3lame (the only way to get per-frame stereo mode decisions).
        # Fail loudly here rather than let those cases go missing.
        ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libmp3lame

    - name: Build mp3packercpp
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j $(nproc)

    - name: Unit tests
      run: ctest --test-dir build --output-on-failure

    - name: Lossless validation matrix
      run: bash scripts/test_matrix.sh build/bin/mp3packercpp

    - name: Generate Test Audio
      run: |
        # Generate a 5-second sine wave
        ffmpeg -y -f lavfi -i "sine=frequency=1000:duration=5" test_tone.wav
        
        # Encode with CRC (-p) and VBR (-V 2) to force Xing tag and gapless info
        lame -p -V 2 test_tone.wav test_original.mp3

    - name: Process with mp3packercpp
      run: |
        ./build/bin/mp3packercpp -z test_original.mp3 test_packed.mp3

    - name: Verify Audio Fidelity (Lossless Check)
      run: |
        echo "Decoding audio to WAV using LAME..."
        lame --decode test_original.mp3 orig.wav
        lame --decode test_packed.mp3 packed.wav
        
        echo "Comparing LAME decoded PCM data..."
        if cmp -s orig.wav packed.wav; then
          echo "SUCCESS: The LAME decoded audio is bit-perfect!"
        else
          echo "ERROR: The LAME decoded audio differs!"
          exit 1
        fi
        
        echo "Decoding audio to WAV using FFmpeg..."
        ffmpeg -y -v error -i test_original.mp3 orig_ff.wav
        ffmpeg -y -v error -i test_packed.mp3 packed_ff.wav
        
        echo "Comparing FFmpeg decoded PCM data..."
        if cmp -s orig_ff.wav packed_ff.wav; then
          echo "SUCCESS: The FFmpeg decoded audio is bit-perfect!"
        else
          echo "ERROR: The FFmpeg decoded audio differs!"
          exit 1
        fi

    - name: Verify Structural Integrity and CRC
      run: |
        # mp3val checks the MPEG frame headers, CRC validity, and overall stream integrity
        mp3val test_packed.mp3 > mp3val_report.txt
        cat mp3val_report.txt
        
        # fail only on real structural/CRC issues; ignore the cosmetic
        # "No supported tags" warning that mp3val emits for tagless files
        if grep -E "WARNING|ERROR" mp3val_report.txt | grep -v "No supported tags" | grep -q .; then
          echo "ERROR: mp3val detected structural issues or bad CRC!"
          exit 1
        else
          echo "SUCCESS: MP3 structure and CRCs are valid."
        fi

  # The deeper suites, in their own job so they run alongside the matrix rather
  # than after it: between them they take longer than everything else here.
  #
  # Both were written before there was any CI to run them in, and every bug in
  # this project's history was found by one of these scripts being run by hand —
  # #10 by the randomised corpus, and #12 shipped in a release precisely because
  # nothing automated ran them.
  deep_validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1.13
      with:
        cmake-version: '3.21.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        # mpg123 on top of the usual three: test_regression.sh checks losslessness
        # through three independent decoders, because one decoder proves less than
        # it looks — a wrong Xing tag changes ffmpeg's gapless trimming and leaves
        # mpg123 unmoved.
        sudo apt-get install -y lame ffmpeg mp3val mpg123

    - name: Build mp3packercpp
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j $(nproc)

    - name: Cross-decoder regression suite
      run: bash scripts/test_regression.sh build/bin/mp3packercpp

    # The seed rotates with the run number, so successive pushes explore different
    # corners instead of re-testing one fixed corpus forever. The script prints the
    # seed it used, and passing that seed back reproduces the exact corpus locally.
    - name: Randomised corpus
      run: bash scripts/test_random.sh build/bin/mp3packercpp 60 ${{ github.run_number }}
